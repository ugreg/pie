tools:
  edit:
    default: ask
    allowed: []
  find:
    default: allow
    allowed: []
  grep:
    default: allow
    allowed: []
  ls:
    default: allow
    allowed: []
  read:
    default: ask
    allowed: []
  write:
    default: deny
    allowed: []
bash:
  git *:
    default: ask
    allowed: []
  npm *:
    default: ask
    allowed: []
  rm *:
    default: deny
    allowed: []
  dd *:
    default: deny
    allowed: []
  kill *:
    default: deny
    allowed: []
  killall *:
    default: deny
    allowed: []
  nc *:
    default: deny
    allowed: []
  mv *:
    default: deny
    allowed: []
  allowed: []
exec:
  default: deny
  allowed: []
mcp:
  default: ask
  allowed: []
skills:
  default: ask
  allowed: []
special:
  default: ask
  allowed: []
extensionTools:
  code_search:
    default: allow
    allowed: []
  fetch_content:
    default: allow
    allowed: []
  get_search_content:
    default: allow
    allowed: []
  web_search:
    default: ask
    allowed: []
restricted:
- ./dev/
- ./usr/sbin/
- ./private/etc/
- ./Library/Bluetooth
- ./Library/Trial
- ~/.Trash
- ./Library/Application Support/com.apple.TCC
- ~/Library/Sharing
- ~/Library/Messages
- ~/Pictures/Photos Library.photoslibrary
- ~/Movies/TV
- ~/Music/Music
