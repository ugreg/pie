name: Test

on:
  push:
    branches: [d, m]
  pull_request:
    branches: [d, m]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Run tests
        run: bun test

  sandbox-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      
      - name: Package extension
        run: |
          npm pack
          ls -la *.tgz
      
      - name: Install pi coding agent
        run: |
          npm install -g @earendil-works/pi-coding-agent
      
      - name: Add extension to agent
        run: |
          mkdir -p ~/.pi/agent/extensions
          tar -xzf *.tgz -C ~/.pi/agent/extensions
          cp permissions.example.json ~/.pi/permissions.json
      
      - name: Test allowed commands
        run: |
          # Test allowed commands
          echo "Testing allowed commands..."
          bun test test/
          
          # Verify extension is loaded
          echo "Verifying extension..."
          ls ~/.pi/agent/extensions/
